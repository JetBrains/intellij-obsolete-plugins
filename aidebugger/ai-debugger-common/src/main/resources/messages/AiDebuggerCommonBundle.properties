  <p>\
    AI Agents Debugger plugin will locally trace the execution of your agent. No code changes are needed.\
  </p>\
  <p>\
    Just launch your <b><inline_content_element>Run</inline_content_element></b> Run configuration.\
  </p>\
  <p>\
    Traces with agents' steps and decisions will appear here automatically.\
  </p>

