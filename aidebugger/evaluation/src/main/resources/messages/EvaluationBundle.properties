## Steps
### Intro
onboarding.intro.step.header=<b>Welcome to AI Evaluation</b>
onboarding.intro.step.text=We'll help you create your first dataset and run an evaluation of your agent on it.
### Add to Dataset (button)
onboarding.add.to.dataset.step.header=<b>Add to Dataset</b>
onboarding.add.to.dataset.step.text=Click <b>New Dataset</b> to create your first dataset.
### Enter dataset name
onboarding.enter.dataset.name.step.header=<b>Add to Dataset</b>
onboarding.enter.dataset.name.step.text=Enter the dataset <b>Name</b>.
### Select dataset
onboarding.select.dataset.step.header=<b>Add to Dataset</b>
onboarding.select.dataset.step.text=Select the dataset to add an item to it. You can add traces to multiple datasets at once.
### Add to Dataset (dialog - inputs)
onboarding.add.to.dataset.inputs.step.header=<b>Review Inputs and Save</b>
onboarding.add.to.dataset.inputs.step.text=Quickly verify the <b>Input JSON path</b>, the <b>Expected output JSON path</b>, and the <b>Expected output</b> below.<br>Then click <b>Add</b> to save this trace.
### Switch to Datasets folder in toolwindow
onboarding.switch.to.datasets.step.header=<b>Switch to Datasets</b>
onboarding.switch.to.datasets.step.text=Your trace results have been added to the dataset. You can always find your items in the Datasets tab.
### Switch to Evaluation folder in toolwindow
onboarding.switch.to.evaluation.step.header=<b>Switch to Evaluation</b>
onboarding.switch.to.evaluation.step.text=This is the Evaluation tab. Here you can evaluate your agent over your datasets. But first, you need to create a Run configuration for it.
### Evaluation view: plus button
onboarding.evaluation.plus.step.header=<b>Create Configuration</b>
onboarding.evaluation.plus.step.text=Click here to create a new Evaluation configuration.
### Create Configuration dialog: fill fields
onboarding.create.config.form.step.header=<b>Configure Evaluation</b>
onboarding.create.config.form.step.text=Choose a <b>Run configuration</b>, set a <b>Name</b>, and select an <b>Input dataset</b>.<br>Adjust the <b>LLM-as-a-Judge Prompt</b> and <b>Model</b> if needed.<br>Then click <b>OK</b> to confirm the configuration.
### Evaluation view: run button
onboarding.evaluation.run.step.header=<b>Run Evaluation</b>
onboarding.evaluation.run.step.text=Click here to start a new evaluation.
### Evaluation view: run in cloud button
onboarding.evaluation.run.cloud.step.header=<b>Advanced: Run Evaluation in Cloud</b>
onboarding.evaluation.run.cloud.step.text=You can run your long-running evaluations in the cloud via the Cadence plugin
### Results: output column
onboarding.results.output.step.header=<b>Review Outputs</b>
onboarding.results.output.step.text=Here you can check the evaluation results.
### Help button
onboarding.repeat.onboarding.step.header=<b>Repeat tour</b>
onboarding.repeat.onboarding.step.text=You can always repeat this tour by clicking here. Have a nice Evaluation process!

