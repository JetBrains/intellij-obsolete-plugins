aitoolkit.feed.empty.text=<h5>Traces of your AI agents will be shown here</h5>\
  <p>\
    AI Agents Debugger plugin will locally trace the execution of your Koog agents. No code changes are needed.\
  </p>\
  <p>\
    Launch your <b><inline_content_element>Run</inline_content_element></b> Run configuration.\
  </p>\
  <p>\
    Traces with agents' steps and decisions will appear here automatically.\
  </p>

aitoolkit.feed.outdatedKoog.text=<h5>It looks like your Koog is out of date</h5>\
  <p>\
    Please update Koog to version <b>0.5.2</b> or later to enable AI Agents Debugger support.\
  </p>\
  <p>\
    Then launch your <b><inline_content_element>Run</inline_content_element></b> Run configuration.\
  </p>